name: Проверки, сборка и публикация приложения

on:
  push:
    branches: ['main', 'feature/mobile-app', 'design/material-3-redesign']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: приложение-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Проверки Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt
      - name: Проверка синтаксиса
        run: python -m compileall -q services handlers database.py main.py run_web.py
      - name: Проверки параллельных запросов, кэша и уведомлений
        run: python -m unittest discover -s tests -v
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка инструментов браузерных проверок
        run: |
          npm install --prefix "$RUNNER_TEMP/web-tests" playwright
          "$RUNNER_TEMP/web-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Проверка сценариев интерфейса
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory webapp > "$RUNNER_TEMP/web-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/web-tests/node_modules" node scripts/test_material_web.cjs
  build-android:
    name: Сборка Android (RiiSchedule.apk и RiiSchedule-debug.apk)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Распаковка сертификата подписи (Keystore)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Декодирование личного сертификата разработчика..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            echo "KEYSTORE_FILE=/tmp/release.jks" >> $GITHUB_ENV
          elif [ -f "certs/release.jks" ]; then
            echo "Использование сертификата certs/release.jks..."
            echo "KEYSTORE_FILE=$(pwd)/certs/release.jks" >> $GITHUB_ENV
          else
            echo "::error::Сертификат релизной подписи не найден"
            exit 1
          fi

      - name: Установка зависимостей Flutter
        run: |
          cd app
          flutter pub get

      - name: Анализ приложения
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app

      - name: Проверки приложения
        run: flutter test
        working-directory: app

      - name: Сборка релизного APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Goll7535' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'yearnings' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Goll7535' }}
        run: |
          cd app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Сборка отладочного APK (debug)
        run: |
          cd app
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Подготовка файлов APK
        run: |
          mkdir -p dist
          if [ -f app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp app/build/app/outputs/flutter-apk/app-release.apk dist/RiiSchedule.apk
          fi
          cp app/build/app/outputs/flutter-apk/app-debug.apk dist/RiiSchedule-debug.apk

      - name: Загрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            dist/RiiSchedule.apk
            dist/RiiSchedule-debug.apk
          if-no-files-found: error

  build-ios:
    name: Сборка iOS (RiiSchedule.ipa)
    runs-on: macos-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Установка зависимостей Flutter
        run: |
          cd app
          flutter pub get

      - name: Сборка приложения iOS без подписи
        run: |
          cd app
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          flutter build ios --release --no-codesign

      - name: Упаковка приложения в формат IPA
        run: |
          mkdir -p dist/Payload
          cp -r app/build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -r RiiSchedule.ipa Payload
          rm -rf Payload

      - name: Загрузка IPA в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: dist/RiiSchedule.ipa
          if-no-files-found: error

  publish-release:
    name: Публикация релиза в GitHub Releases
    needs: [server, web, build-android, build-ios]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    outputs:
      published: ${{ steps.release.outputs.id != '' }}
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Чтение версии приложения
        id: get_version
        run: |
          RAW_VERSION=$(grep 'version:' app/pubspec.yaml | head -n 1 | sed 's/version: //' | tr -d '[:space:]')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          VERSION_BUILD=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_BUILD=$VERSION_BUILD" >> $GITHUB_ENV
          echo "Текущая версия: $VERSION_NAME, сборка: $VERSION_BUILD"

      - name: Проверка наличия опубликованной версии
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Версия уже опубликована; повторная публикация не требуется."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Создание директории для файлов релиза
        if: steps.existing.outputs.exists != 'true'
        run: mkdir -p release-assets

      - name: Скачивание пакетов Android
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-packages
          path: release-assets

      - name: Скачивание пакета iOS
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ios-package
          path: release-assets

      - name: Проверка содержимого релиза
        if: steps.existing.outputs.exists != 'true'
        run: ls -la release-assets

      - name: Подготовка описания релиза
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/prepare_release_body.py

      - name: Публикация релиза на GitHub
        id: release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Релиз v${{ env.APP_VERSION }} (сборка ${{ env.APP_BUILD }})
          generate_release_notes: false
          body_path: release_body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish-rustore:
    name: Публикация Android в RuStore
    needs: [build-android, publish-release]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.publish-release.outputs.published == 'true' }}
    env:
      RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
      RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
      RUSTORE_PACKAGE_NAME: "com.yearnings.rii"
      RUSTORE_PUBLISH_TYPE: "INSTANTLY"
      APK_PATH: "release-assets/RiiSchedule.apk"
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Проверка настроек RuStore
        run: |
          if [ -z "$RUSTORE_KEY_ID" ] || [ -z "$RUSTORE_PRIVATE_KEY" ]; then
            echo "::error::Не настроены ключи публикации RuStore"
            exit 1
          fi
      - name: Скачивание подписанного Android
        uses: actions/download-artifact@v4
        with:
          name: android-packages
          path: release-assets
      - name: Установка библиотек публикации
        run: python3 -m pip install requests cryptography
      - name: Отправка обновления на модерацию с автоматической публикацией
        run: python3 scripts/upload_to_rustore.py
