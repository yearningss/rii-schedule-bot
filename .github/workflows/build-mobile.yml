name: Сборка мобильных приложений Flutter (Android APK и iOS IPA)

on:
  push:
    branches:
      - 'feature/mobile-app'
      - 'main'
    paths:
      - 'app/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Сборка Android (RiiSchedule.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Распаковка сертификата подписи (Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Декодирование личного сертификата разработчика..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
            echo "KEYSTORE_FILE=/tmp/release.jks" >> $GITHUB_ENV
          else
            echo "Секрет KEYSTORE_BASE64 не найден, будет использована отладочная подпись"
          fi

      - name: Установка зависимостей Flutter
        run: |
          cd app
          flutter pub get

      - name: Сборка релизного APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          flutter build apk --release

      - name: Подготовка файла APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/RiiSchedule.apk

      - name: Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: RiiSchedule-Android-Signed-APK
          path: dist/RiiSchedule.apk
          if-no-files-found: error
