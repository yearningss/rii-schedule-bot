name: Проверка дизайна Material 3
on:
  push:
    branches: ['design/material-3-redesign']
  pull_request:
    paths: ['app/**', 'webapp/**', 'scripts/test_material_web.cjs', '.github/workflows/validate-design.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build apk --debug --android-skip-build-dependency-validation
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: material-3-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка инструментов браузерных проверок
        run: |
          npm install --prefix "$RUNNER_TEMP/web-tests" playwright
          "$RUNNER_TEMP/web-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Проверка сценариев интерфейса
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory webapp > "$RUNNER_TEMP/web-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/web-tests/node_modules" node scripts/test_material_web.cjs
