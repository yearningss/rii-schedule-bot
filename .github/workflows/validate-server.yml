name: Проверка серверной логики
on:
  push:
    branches: ['main', 'design/material-3-redesign']
    paths: ['services/**', 'handlers/**', 'database.py', 'main.py', 'requirements.txt', 'tests/**', '.github/workflows/validate-server.yml']
  pull_request:
    paths: ['services/**', 'handlers/**', 'database.py', 'main.py', 'requirements.txt', 'tests/**', '.github/workflows/validate-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    name: Проверки Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt
      - name: Проверка синтаксиса
        run: python -m compileall -q services handlers database.py main.py run_web.py
      - name: Проверки параллельных запросов, кэша и уведомлений
        run: python -m unittest discover -s tests -v
